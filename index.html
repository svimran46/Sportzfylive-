<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Hub</title>
    
    <!-- CSS: This section handles all the styling, colors, and layout -->
    <style>
        /* Color Palette & Base Settings */
        :root {
            --bg-color: #0f172a;      /* Deep dark blue background */
            --nav-bg: #020617;        /* Almost black for navbar */
            --card-bg: #1e293b;       /* Slightly lighter dark blue for cards */
            --accent: #e74c3c;        /* Live red accent */
            --text-main: #f8fafc;     /* White text */
            --text-muted: #94a3b8;    /* Grey text */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Navigation Bar */
        header {
            background-color: var(--nav-bg);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(to bottom, var(--nav-bg), var(--bg-color));
        }

        .hero h1 {
            margin: 0;
            font-size: 36px;
        }

        .hero p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 18px;
        }

        /* Main Content & Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Match Cards */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: var(--accent);
        }

        /* Placeholder image area if API doesn't provide a working image */
        .card-img {
            height: 160px;
            background: #334155 url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
            position: relative;
        }

        .live-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .category {
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }

        .time {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .watch-btn {
            margin-top: auto;
            display: block;
            text-align: center;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 16px;
        }

        .watch-btn:hover {
            background-color: #1d4ed8;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            border-top: 1px solid #334155;
            color: var(--text-muted);
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            nav { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
            nav a { margin: 0; }
        }
    </style>
</head>
<body>

    <!-- Website Navigation -->
    <header>
        <div class="logo">Sportz<span>Hub</span></div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Live Matches</a>
            <a href="#">Football</a>
            <a href="#">Cricket</a>
            <a href="#">Highlights</a>
        </nav>
    </header>

    <!-- Welcome Banner -->
    <section class="hero">
        <h1>Live Sports Streaming</h1>
        <p>Watch your favorite matches from around the world, live and in HD.</p>
    </section>

    <!-- Match Grid Area -->
    <div class="container">
        <div class="grid" id="match-grid">
            <!-- JavaScript will delete this loading text and insert the cards here -->
            <h2 style="text-align: center; width: 100%; color: #94a3b8;">Connecting to server... Fetching live matches!</h2>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SportzHub Live. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT: The engine that talks to the Streamed.pk API -->
    <script>
        const apiUrl = 'https://streamed.pk/api/matches/live';
        const matchGrid = document.getElementById('match-grid');

        // Fetch the data from the API you found
        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.json();
            })
            .then(data => {
                // Clear the loading text
                matchGrid.innerHTML = '';

                // Loop through every match in the JSON data
                data.forEach(match => {
                    // Create a new card div
                    const card = document.createElement('div');
                    card.className = 'card';

                    // Convert the UNIX timestamp (like 1720104600000) into a readable time
                    let timeString = "Live Now";
                    if(match.date) {
                        const dateObj = new Date(match.date);
                        timeString = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    }

                    // Build the HTML inside the card
                    card.innerHTML = `
                        <div class="card-img">
                            <span class="live-indicator">● LIVE</span>
                        </div>
                        <div class="card-content">
                            <div class="category">${match.category || 'Sports'}</div>
                            <h3 class="title">${match.title}</h3>
                            <div class="time">Starts: ${timeString}</div>
                            
                            <!-- Placeholder button -->
                            <button class="watch-btn" onclick="alert('In a real site, this would open a video player for ID: ${match.id}')">
                                Watch Live
                            </button>
                        </div>
                    `;

                    // Add the card to the grid
                    matchGrid.appendChild(card);
                });
            })
            .catch(error => {
                // If it fails (like a CORS block), show a helpful error
                console.error('Error fetching data:', error);
                matchGrid.innerHTML = `
                    <div style="text-align: center; width: 100%;">
                        <h2 style="color: #e74c3c;">Oops! The API blocked the request.</h2>
                        <p style="color: #94a3b8;">This happens when trying to access their data from a local desktop file instead of a real web server. To fix this, you would use a "CORS proxy" or host this file on a real server.</p>
                    </div>
                `;
            });
    </script>

</body>
</html>
