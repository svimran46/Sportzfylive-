<!DOCTYPE html>
<html>
<head>
  <title>My Live Sports Site</title>
  
  <!-- This <style> section makes the data look pretty -->
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background-color: #f0f2f5; 
      padding: 20px; 
    }
    .match-card { 
      background: white; 
      padding: 15px; 
      margin-bottom: 15px; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
      max-width: 400px;
    }
    .sport-type { 
      color: #e74c3c; 
      font-size: 12px; 
      font-weight: bold; 
      text-transform: uppercase; 
    }
    .match-title { 
      font-size: 18px; 
      font-weight: bold; 
      margin-top: 5px; 
    }
  </style>
</head>
<body>

  <h1>Live Streams Available Now</h1>
  
  <!-- This is the container where our JavaScript will inject the matches -->
  <div id="match-container">
    <p>Loading the latest matches...</p>
  </div>

  <!-- This is the brain that talks to the API -->
  <script>
    // The exact URL you found
    const apiUrl = 'https://streamed.pk/api/matches/live'; 

    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
         // Find our container on the page
         const container = document.getElementById('match-container');
         
         // Clear out the "Loading..." text
         container.innerHTML = ''; 
         
         // Loop through the data from your screenshot
         data.forEach(match => {
            // Create a new "card" for every single match
            const matchCard = document.createElement('div');
            matchCard.className = 'match-card';
            
            // We use match.category and match.title because we saw those exact words in your screenshot!
            matchCard.innerHTML = `
              <div class="sport-type">${match.category}</div>
              <div class="match-title">${match.title}</div>
            `;
            
            // Add the finished card to our container
            container.appendChild(matchCard);
         });
      })
      .catch(error => {
         // If something fails, show an error
         document.getElementById('match-container').innerHTML = 'Oops! Could not load the matches.';
         console.error("Error:", error);
      });
  </script>

</body>
</html>
