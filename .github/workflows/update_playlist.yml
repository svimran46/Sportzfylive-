name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pip install requests

      - name: Run stream validator script
        run: python extract_links_only.py

      - name: Commit and push updated playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated playlist update every 6 hours"
          file_pattern: playlist.m3u
